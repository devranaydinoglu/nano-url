services:
  cassandra_01:
    image: cassandra:5.0.8
    container_name: cassandra_01
    ports:
      - 9042:9042
    volumes:
      - cassandra-node-01:/var/lib/cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: nanourl
      CASSANDRA_SEEDS: cassandra_01
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    healthcheck:
      test: ["CMD", "cqlsh", "-u", "cassandra", "-p", "cassandra"]
      interval: 20s
      timeout: 10s
      retries: 2

  cassandra_02:
    image: cassandra:5.0.8
    container_name: cassandra_02
    depends_on:
      cassandra_01:
        condition: service_healthy
    volumes:
      - cassandra-node-02:/var/lib/cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: nanourl
      CASSANDRA_SEEDS: cassandra_01
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    healthcheck:
      test: ["CMD", "cqlsh", "-u", "cassandra", "-p", "cassandra"]
      interval: 20s
      timeout: 10s
      retries: 2

  cassandra_03:
    image: cassandra:5.0.8
    container_name: cassandra_03
    depends_on:
      cassandra_01:
        condition: service_healthy
    volumes:
      - cassandra-node-03:/var/lib/cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: nanourl
      CASSANDRA_SEEDS: cassandra_01
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    healthcheck:
      test: ["CMD", "cqlsh", "-u", "cassandra", "-p", "cassandra"]
      interval: 20s
      timeout: 10s
      retries: 2

  cassandra_init:
    image: cassandra:5.0.8
    container_name: cassandra_init
    depends_on:
      cassandra_01:
        condition: service_healthy
    volumes:
      - ./cassandra/init.cql:/init.cql:ro
    entrypoint:
      - sh
      - -c
      - cqlsh cassandra_01 -f /init.cql
    restart: "no"

  server_01:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: server_01
    ports:
      - 8080:8080
    depends_on:
      cassandra_01:
        condition: service_healthy

  redis:
    image: redis:8.10.0
    container_name: redis

volumes:
  cassandra-node-01:
  cassandra-node-02:
  cassandra-node-03: