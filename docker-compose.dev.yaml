services:
  server_01:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: server_01
    ports:
      - 8080:8080
    depends_on:
      cassandra_01:
        condition: service_healthy

  cassandra_01:
    image: cassandra:5.0.8
    container_name: cassandra_01
    ports:
      - 9042:9042
    volumes:
      - cassandra-node-01:/var/lib/cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: nanourl
      CASSANDRA_SEEDS: cassandra_01
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    healthcheck:
      test: ["CMD", "cqlsh", "-u", "cassandra", "-p", "cassandra"]
      interval: 20s
      timeout: 10s
      retries: 2

  redis:
    image: redis:8.10.0
    container_name: redis

volumes:
  cassandra-node-01: