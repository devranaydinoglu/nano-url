services:
  cassandra_01:
    image: cassandra:5.0.8
    container_name: cassandra_01
    ports:
      - 9042:9042
    volumes:
      - cassandra-node-01:/var/lib/cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: nanourl
      CASSANDRA_SEEDS: cassandra_01
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    healthcheck:
      test: [ "CMD", "cqlsh", "-u", "cassandra", "-p", "cassandra" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  cassandra_init:
    image: cassandra:5.0.8
    container_name: cassandra_init
    depends_on:
      cassandra_01:
        condition: service_healthy
    volumes:
      - ./cassandra/init.cql:/init.cql:ro
    entrypoint:
      - sh
      - -c
      - cqlsh cassandra_01 -f /init.cql
    restart: "no"

  server_01:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: server_01
    ports:
      - 8080:8080
    depends_on:
      cassandra_init:
        condition: service_completed_successfully
    environment:
      MACHINE_ID: 1

  redis:
    image: redis:8.10.0
    container_name: redis
    ports:
      - 6379:6379

volumes:
  cassandra-node-01: